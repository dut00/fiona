<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- B: "High note" — a bird hits the high note, sound waves hit the glass, the glass cracks -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <!-- bird (left), singing upward -->
  <g transform="translate(40 230) rotate(-12)">
    <path d="M22 70 L-4 90 L30 84Z" fill="#0891b2"/>
    <ellipse cx="62" cy="60" rx="58" ry="50" fill="#22d3ee"/>
    <ellipse cx="52" cy="76" rx="28" ry="20" fill="#cffafe"/>
    <path d="M30 56 q-6 26 22 30" stroke="#0891b2" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- eyes squeezed shut: belting -->
    <path d="M78 40 q8 -8 16 0" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M110 44 L148 34 L116 58Z" fill="#fbbf24"/>
    <path d="M114 62 L144 70 L112 70Z" fill="#f59e0b"/>
  </g>
  <!-- sound waves -->
  <g stroke="#f472b6" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M222 200 q20 40 0 80"/>
    <path d="M252 178 q32 62 0 124" stroke-opacity=".7"/>
    <path d="M282 156 q44 84 0 168" stroke-opacity=".4"/>
  </g>
  <!-- glass (right) with crack -->
  <path d="M330 150h120c0 66-26 104-60 110-34-6-60-44-60-110z" fill="#a5f3fc" fill-opacity=".12" stroke="#a5f3fc" stroke-width="12" stroke-linejoin="round"/>
  <path d="M390 260v74M354 344h72" stroke="#a5f3fc" stroke-width="12" stroke-linecap="round"/>
  <path d="M352 170 l16 18 -10 16 18 14 -6 18" stroke="#fde047" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tiny shards -->
  <path d="M462 140l12 -8 -2 14z M470 186l14 2 -8 10z" fill="#a5f3fc"/>
</svg>
