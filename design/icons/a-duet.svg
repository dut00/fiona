<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A: "Duet" — a little bird perched on the rim of a wine glass, singing -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <!-- glass -->
  <path d="M150 196h212c0 96-42 156-106 166-64-10-106-70-106-166z" fill="#a5f3fc" fill-opacity=".12" stroke="#a5f3fc" stroke-width="16" stroke-linejoin="round"/>
  <path d="M256 362v74M200 446h112" stroke="#a5f3fc" stroke-width="16" stroke-linecap="round"/>
  <path d="M176 232c8 40 26 70 52 84" stroke="#a5f3fc" stroke-opacity=".5" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- bird on the right rim -->
  <g transform="translate(300 98)">
    <path d="M18 74 L-6 96 L26 86Z" fill="#db2777"/>
    <ellipse cx="44" cy="62" rx="46" ry="40" fill="#f472b6"/>
    <ellipse cx="36" cy="74" rx="22" ry="16" fill="#fbcfe8"/>
    <path d="M10 52 q-14 -18 6 -22" stroke="#db2777" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="62" cy="48" r="7" fill="#0f172a"/>
    <circle cx="64.5" cy="45.5" r="2.4" fill="#fff"/>
    <!-- open beak -->
    <path d="M84 50 L112 40 L88 58Z" fill="#fbbf24"/>
    <path d="M86 60 L108 66 L84 66Z" fill="#f59e0b"/>
    <!-- feet on rim -->
    <path d="M34 100v10M52 100v10" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- notes -->
  <g fill="#f9a8d4">
    <path d="M430 70v52a14 12 0 1 1 -8 -11V78l34 -8v42a14 12 0 1 1 -8 -11V82z"/>
  </g>
</svg>
